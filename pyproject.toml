[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "isr-maritime-threat-ml"
version = "0.1.0"
readme = "README.md"
description = "Synthetic maritime multi-sensor anomaly detection and Foundry integration contracts"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "pyarrow>=19,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1,<2", "matplotlib>=3.9,<4"]

[project.urls]
Repository = "https://github.com/cankaan120/isr-maritime-threat-ml"
Issues = "https://github.com/cankaan120/isr-maritime-threat-ml/issues"

[project.scripts]
isr-maritime = "src.pipeline:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
