name: Pipeline quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: isr-maritime --output isr-artifacts --tracks isr-tracks.csv
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            ${{ runner.temp }}/isr-artifacts/metrics.json
            ${{ runner.temp }}/isr-artifacts/run_manifest.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: docker build -t isr-inference:ci .
      - name: Verify container inference and replay
        env:
          ISR_API_KEY: ci-only-key-for-isolated-container-smoke-test
        run: |
          docker run -d --name isr-smoke --read-only --tmpfs /tmp --tmpfs /var/lib/isr:uid=10001,gid=10001 -p 127.0.0.1:8000:8000 -e ISR_API_KEY isr-inference:ci
          python scripts/smoke_service.py
      - name: Container logs
        if: always()
        run: docker logs isr-smoke || true
