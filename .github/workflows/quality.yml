name: Pipeline quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: isr-maritime --output isr-artifacts --tracks isr-tracks.csv
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            coverage.xml
            ${{ runner.temp }}/isr-artifacts/metrics.json
            ${{ runner.temp }}/isr-artifacts/run_manifest.json
